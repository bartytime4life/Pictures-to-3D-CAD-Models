[project]
name = "pictures-to-cad"
version = "0.1.0"
description = "Measured photo profiles to inspectable CAD solids"
requires-python = ">=3.12,<3.13"
dependencies = [
  "cadquery==2.7.0",
  "fastapi==0.141.1",
  "uvicorn==0.52.1",
  "pillow==13.0.0",
  "python-multipart==0.0.32",
  "opencv-python-headless>=4.12,<5",
  "shapely>=2.1,<3",
]

[dependency-groups]
dev = ["pytest>=8.4,<10", "httpx==0.28.1", "ruff>=0.14,<1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100
