name: Validate workbench
on:
  # Pull requests get their own run; pushing a PR branch would otherwise run it twice.
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies and build
        run: make setup-app
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Check Python and frontend formatting
        run: make lint
      - name: Test geometry and browser workflow
        run: make test-app
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
