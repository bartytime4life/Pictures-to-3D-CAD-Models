name: Validate workbench
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies and build
        run: make setup-app
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Check Python and frontend formatting
        run: make lint
      - name: Test geometry and browser workflow
        run: make test-app
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
