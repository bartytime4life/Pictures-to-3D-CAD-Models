name: Validate reference library
on:
  push:
    branches: [main]
    paths: ['reference-library/**', '.github/workflows/reference-library.yml', 'Makefile', 'scripts/setup-library.sh']
  pull_request:
    paths: ['reference-library/**', '.github/workflows/reference-library.yml', 'Makefile', 'scripts/setup-library.sh']
permissions:
  contents: read
defaults:
  run:
    working-directory: reference-library
jobs:
  library:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: reference-library/package-lock.json
      - name: Install OpenSCAD and DejaVu fonts
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends openscad fonts-dejavu-core
      - name: Set up isolated library dependencies
        run: make -C .. setup-library
      - name: Regenerate committed outputs
        run: make calc figures html pdf PYTHON=.venv/bin/python PDF_PYTHON=.venv/bin/python
      - name: Committed outputs are up to date
        # The PDF is rebuilt above (the tests read it) but not compared: font builds differ between machines.
        run: git diff --exit-code -- . ':(exclude)output/pdf'
      - name: Unit and cross-language tests
        run: make test PYTHON=.venv/bin/python CAD_REFERENCE_PYTHON=.venv/bin/python
      - name: OpenSCAD plate pipeline
        run: .venv/bin/python examples/build_plate.py --require-openscad
      - name: Browser checks of offline file (page and Photos workspace)
        run: |
          CAD_REFERENCE_BROWSER_TRANSPORT=file make check
          cp tmp/qa/browser-check.json tmp/qa/browser-check-file.json
          cp tmp/qa/photo-check.json tmp/qa/photo-check-file.json
          cp tmp/qa/cad-check.json tmp/qa/cad-check-file.json
          cp tmp/qa/cad-native-check.json tmp/qa/cad-native-check-file.json
      - name: Browser checks over loopback HTTP (page and Photos workspace)
        run: |
          CAD_REFERENCE_BROWSER_TRANSPORT=http make check
          cp tmp/qa/browser-check.json tmp/qa/browser-check-http.json
          cp tmp/qa/photo-check.json tmp/qa/photo-check-http.json
          cp tmp/qa/cad-check.json tmp/qa/cad-check-http.json
          cp tmp/qa/cad-native-check.json tmp/qa/cad-native-check-http.json
      - name: Upload screenshots and check records
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reference-library-qa
          path: reference-library/tmp/qa/
          retention-days: 7
