<g font-family="sans-serif" fill="#173a50"><text x="55" y="50" font-size="13" letter-spacing="2">SYNTHETIC CAD EXERCISE / ALL DIMENSIONS IN MM</text><text x="55" y="95" font-size="34">A measured profile becomes a model.</text><text x="55" y="128" font-size="15">Illustrative values only. No photograph, fit, or physical print has been validated.</text></g>
