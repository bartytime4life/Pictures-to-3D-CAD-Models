<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="690" viewBox="0 0 1000 690">
<title>Synthetic two-hole plate teaching diagram</title><desc>Top and side views of a 60 by 30 by 4 millimeter plate with two 5 millimeter diameter holes at 40 millimeter center spacing. Not a production drawing.</desc>
