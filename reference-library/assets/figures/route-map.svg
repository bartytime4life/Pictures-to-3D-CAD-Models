<title id="route-map-title">Route map: from available input to a handbook workflow</title>
<desc id="route-map-desc">Each kind of input leads to a starting workflow. Two goals redirect: an organic subject with an exact mount leads to Workflow E, and a holder for an owned object leads to the held-object section.</desc>
