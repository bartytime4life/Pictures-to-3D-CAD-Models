<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 170" width="1000" height="170" role="img" aria-labelledby="process-flow-title process-flow-desc" class="figure-svg">
<title id="process-flow-title">Five-stage workflow from photographs to a checked print</title>
<desc id="process-flow-desc">Capture, measure, reconstruct, model and draw, then print and check; the check feeds back into measurement.</desc>
