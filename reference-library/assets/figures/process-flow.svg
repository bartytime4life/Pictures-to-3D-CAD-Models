<text x="36" y="70" font-family="DejaVu Sans, Verdana, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start" style="fill:#172b37">Capture</text>
<text x="36" y="94" font-family="DejaVu Sans, Verdana, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" style="fill:#566975">photos + scale refs</text>
<line x1="192" y1="64" x2="207.6" y2="64" style="stroke:#7d98b7;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"/>
<polygon points="214,64 206.63,67.12 206.63,60.88" style="fill:#7d98b7"/>
