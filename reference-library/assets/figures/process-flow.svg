<text x="630" y="70" font-family="DejaVu Sans, Verdana, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start" style="fill:#172b37">Model &amp; draw</text>
<text x="630" y="94" font-family="DejaVu Sans, Verdana, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" style="fill:#566975">CAD + drawings</text>
