<text x="432" y="42" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="12" font-weight="700" text-anchor="start" style="fill:#c77a1f">03</text>
<text x="432" y="70" font-family="DejaVu Sans, Verdana, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start" style="fill:#172b37">Reconstruct</text>
<text x="432" y="94" font-family="DejaVu Sans, Verdana, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" style="fill:#566975">rectify, trace, SfM</text>
<line x1="588" y1="64" x2="603.6" y2="64" style="stroke:#7d98b7;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"/>
