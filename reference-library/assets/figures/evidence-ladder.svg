<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-labelledby="evidence-ladder-title evidence-ladder-desc" class="figure-svg">
<title id="evidence-ladder-title">Four evidence classes for every recovered dimension</title>
<desc id="evidence-ladder-desc">Measured, image-derived, inferred and unknown, from strongest to weakest. A derived value inherits the weakest class among its inputs.</desc>
<rect x="0.5" y="0.5" width="999" height="299" rx="14" style="fill:#fffefa;stroke:#c9d6da;stroke-width:1;stroke-linecap:round;stroke-linejoin:round"/>
<rect x="20" y="26" width="230" height="174" rx="8" style="fill:#174d68"/>
<text x="36" y="58" font-family="DejaVu Sans, Verdana, Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start" style="fill:#ffffff">1  Measured</text>
<text x="36" y="82" font-family="DejaVu Sans, Verdana, Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" text-anchor="start" style="fill:#ffffff">instrument or verified</text>
<text x="36" y="100" font-family="DejaVu Sans, Verdana, Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" text-anchor="start" style="fill:#ffffff">drawing</text>
<rect x="262" y="54" width="230" height="146" rx="8" style="fill:#2f7d79"/>
<text x="278" y="86" font-family="DejaVu Sans, Verdana, Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start" style="fill:#ffffff">2  Image-derived</text>
<text x="278" y="110" font-family="DejaVu Sans, Verdana, Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" text-anchor="start" style="fill:#ffffff">image + stated scale</text>
<text x="278" y="128" font-family="DejaVu Sans, Verdana, Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" text-anchor="start" style="fill:#ffffff">and assumptions</text>
<rect x="504" y="82" width="230" height="118" rx="8" style="fill:#c77a1f"/>
<text x="520" y="114" font-family="DejaVu Sans, Verdana, Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start" style="fill:#ffffff">3  Inferred</text>
<text x="520" y="138" font-family="DejaVu Sans, Verdana, Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" text-anchor="start" style="fill:#ffffff">symmetry, standards,</text>
<text x="520" y="156" font-family="DejaVu Sans, Verdana, Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" text-anchor="start" style="fill:#ffffff">likely intent</text>
<rect x="746" y="110" width="230" height="90" rx="8" style="fill:#8a969c"/>
<text x="762" y="142" font-family="DejaVu Sans, Verdana, Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start" style="fill:#ffffff">4  Unknown</text>
<text x="762" y="166" font-family="DejaVu Sans, Verdana, Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" text-anchor="start" style="fill:#ffffff">no support yet:</text>
<text x="762" y="184" font-family="DejaVu Sans, Verdana, Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" text-anchor="start" style="fill:#ffffff">needs evidence</text>
<line x1="24" y1="222" x2="969.6" y2="222" style="stroke:#566975;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round"/>
<polygon points="976,222 968.63,225.12 968.63,218.88" style="fill:#566975"/>
<text x="24" y="242" font-family="DejaVu Sans, Verdana, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" style="fill:#566975">stronger evidence</text>
<text x="976" y="242" font-family="DejaVu Sans, Verdana, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" text-anchor="end" style="fill:#566975">weaker evidence</text>
<text x="24" y="279" font-family="DejaVu Sans, Verdana, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="start" style="fill:#172b37">Weakest input wins:</text>
<rect x="200" y="260" width="205" height="28" rx="14" style="fill:#2f7d79"/>
<text x="302.5" y="278.68" font-family="DejaVu Sans, Verdana, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" style="fill:#ffffff">image-derived position</text>
<text x="422" y="280" font-family="DejaVu Sans, Verdana, Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle" style="fill:#172b37">+</text>
<rect x="440" y="260" width="150" height="28" rx="14" style="fill:#c77a1f"/>
<text x="515" y="278.68" font-family="DejaVu Sans, Verdana, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" style="fill:#ffffff">assumed depth</text>
<text x="607" y="280" font-family="DejaVu Sans, Verdana, Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle" style="fill:#172b37">=</text>
<rect x="625" y="260" width="175" height="28" rx="14" style="fill:#c77a1f"/>
<text x="712.5" y="278.68" font-family="DejaVu Sans, Verdana, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" style="fill:#ffffff">inferred 3D length</text>
</svg>
